body{padding:env(safe-area-inset-top) 16px calc(env(safe-area-inset-bottom) + 18px);max-width:520px;margin:0 auto}
button{font-family:inherit;color:var(--ink)}
.screen{display:none}.screen.on{display:block}

/* En-tête Mondrian */
.mond{display:grid;grid-template-columns:30% 1fr 22%;grid-template-rows:54px 70px 40px;gap:0;border:4px solid var(--ink);margin-top:16px;background:var(--ink);gap:4px}

.tile .em{font-size:32px}

.chips{display:flex;flex-wrap:wrap;gap:8px}

.chip.c.on{background:var(--red)}

input{flex:1;min-width:0;background:var(--w);border:3px solid var(--ink);border-radius:0;color:var(--ink);padding:12px 14px;font-size:16px;font-family:inherit}

.tag{font-size:13px;text-transform:uppercase;letter-spacing:.1em;font-weight:900;margin-bottom:20px;padding-right:44px}
.txt{font-size:28px;line-height:1.28;font-weight:900;letter-spacing:-.01em}
.txt b{background:var(--ink);color:#fff;padding:0 7px;white-space:nowrap}
.ans{display:none;margin-top:18px;padding:12px 14px;background:var(--ink);color:#fff;font-weight:900;font-size:22px}
.rule{margin-top:18px;font-size:13px;font-weight:700;opacity:.75}
.hint{font-size:13px;text-align:center;font-weight:700}
.bar{display:flex;height:10px;margin-top:10px;border:3px solid var(--ink)}

  if(types.indexOf(sel.type)<0 && sel.type!=="Les deux") sel.type = "Les deux";
  types.concat(["Les deux"]).forEach(function(t){
    tb.appendChild(chip(t, sel.type===t, "", function(){sel.type=t; renderSetup()}));
  });
  var cats = uniq(qs.map(function(q){return q.categorie}).filter(Boolean));
  var cb = $("cats"); cb.innerHTML = "";
  if(cats.length>1) cb.appendChild(chip("Tout", false, "all", function(){toggleAll(sel.cats, cats); renderSetup()}));
  cats.forEach(function(c){
    cb.appendChild(chip((EMOJI[c]||"✨")+" "+c, sel.cats.has(c), "c", function(){
      if(sel.cats.has(c)) sel.cats.delete(c); else sel.cats.add(c); renderSetup();
    }));
  });
  var pb = $("players"); pb.innerHTML = "";
  allPlayers.forEach(function(p){
    pb.appendChild(chip(p, sel.players.has(p), "p", function(){
      if(sel.players.has(p)) sel.players.delete(p); else sel.players.add(p); renderSetup();
    }));
  });
  var okCats = cats.filter(function(c){return sel.cats.has(c)}).length;
  var m = sel.games.size===0 ? "Choisissez au moins un jeu" : (okCats===0 ? "Choisissez au moins une catégorie" : (sel.players.size<2 ? "Sélectionnez au moins 2 joueurs" : ""));
  $("msg").textContent = m; $("start").disabled = !!m;
}
function addName(){
  var v = clean($("newName").value);
  if(!v) return;
  v = v.charAt(0).toUpperCase()+v.slice(1);
  var found = allPlayers.filter(function(p){return p.toLowerCase()===v.toLowerCase()})[0];
  if(!found){ allPlayers.push(v); found = v; }
  sel.players.add(found); $("newName").value = ""; renderSetup();
}
function shuffle(a){for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}
function startGame(){
  var pool = DATA.questions.filter(function(q){
    return sel.games.has(q.jeu) && sel.cats.has(q.categorie) && (!q.type || sel.type==="Les deux" || q.type===sel.type);
  });
  if(!pool.length){ $("msg").textContent = "Aucune carte pour cette sélection"; return; }
  deck = shuffle(pool.slice()); idx = -1; show("s3"); next();
}
function fill(t){
  var ps = shuffle(Array.from(sel.players));
  return t.replace(/\{J(\d)\}/g, function(m, n){ return "<b>"+ps[(parseInt(n,10)-1) % ps.length]+"</b>"; });
}
function next(){
  idx++;
  if(idx >= deck.length){ deck = shuffle(deck); idx = 0; }
  var q = deck[idx], st = CAT_STYLE[q.categorie] || ["#fffdf7","#111"], c = $("card");
  c.style.setProperty("--cbg", st[0]); c.style.setProperty("--cfg", st[1]);
  $("tag").textContent = q.jeu+" · "+q.categorie+(q.type?" · "+q.type:"");
  $("qtxt").innerHTML = fill(q.texte);
  revealed = false; $("ans").style.display = "none"; $("ans").textContent = q.reponse || "";
  var gm = DATA.jeux.filter(function(g){return g.jeu===q.jeu})[0];
  $("rule").textContent = (gm && gm.regle) || "";
  $("hint").textContent = q.reponse ? "Touchez la carte pour voir la réponse" : "Touchez la carte pour la suivante";
  $("count").textContent = (idx+1)+" / "+deck.length;
}
$("back2").onclick = function(){show("s1")};
$("quit").onclick = function(){show("s2")};
$("addBtn").onclick = addName;
$("newName").addEventListener("keydown", function(e){if(e.key==="Enter"){e.preventDefault();addName()}});
$("start").onclick = startGame;
$("card").onclick = function(){
  var q = deck[idx];
  if(q && q.reponse && !revealed){ revealed = true; $("ans").style.display = "block"; $("hint").textContent = "Touchez la carte pour la suivante"; }
  else next();
};
load();
</script>
</body>
</html>
