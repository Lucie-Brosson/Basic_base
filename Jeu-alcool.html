<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f4efe3">
<title>La Boîte à Jeux de Lucie</title>

<style>
:root{--bg:#f4efe3;--ink:#111;--red:#e63323;--blue:#1f4fd8;--yel:#ffd400;--w:#fffdf7}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:"Helvetica Neue",Helvetica,Arial,sans-serif}
body{padding:env(safe-area-inset-top) 16px calc(env(safe-area-inset-bottom) + 18px);max-width:520px;margin:0 auto}
button{font-family:inherit;color:var(--ink)}
.screen{display:none}.screen.on{display:block}

/* En-tête Mondrian */
.mond{display:grid;grid-template-columns:30% 1fr 22%;grid-template-rows:54px 70px 40px;gap:0;border:4px solid var(--ink);margin-top:16px;background:var(--ink);gap:4px}
.mond div{background:var(--w)}
.mond .r{background:var(--red)}.mond .b{background:var(--blue)}.mond .y{background:var(--yel)}
.mond .t{grid-column:2/4;grid-row:1/3;display:flex;align-items:center;padding:0 14px}
.mond .a{grid-row:1/4}
.mond h1{margin:0;font-size:25px;line-height:1.02;font-weight:900;letter-spacing:-.02em;text-transform:uppercase}
.mond h1 span{color:var(--red)}
.sub{font-weight:700;margin:18px 0 6px;font-size:15px}
h2{font-size:14px;font-weight:900;text-transform:uppercase;letter-spacing:.08em;margin:26px 0 10px;display:flex;align-items:center;gap:8px}
h2:before{content:"";width:14px;height:14px;background:var(--red);border:3px solid var(--ink)}
h2.b:before{background:var(--blue)}h2.y:before{background:var(--yel)}

.tile{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:var(--yel);border:4px solid var(--ink);box-shadow:6px 6px 0 var(--ink);padding:18px;margin:16px 0 0;font-size:20px;font-weight:900;text-transform:uppercase}
.tile.b{background:var(--blue);color:#fff}
.tile small{display:block;font-weight:600;text-transform:none;font-size:13px;margin-top:3px}
.tile .em{font-size:32px}
.tile.soon{background:transparent;box-shadow:none;border-style:dashed;color:#777;border-color:#999;font-size:16px}
.tile:active{transform:translate(4px,4px);box-shadow:2px 2px 0 var(--ink)}

.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:3px solid var(--ink);background:var(--w);border-radius:0;padding:11px 15px;font-size:16px;font-weight:800;min-height:46px}
.chip.on{background:var(--blue);color:#fff;box-shadow:3px 3px 0 var(--ink)}
.chip.c.on{background:var(--red)}
.chip.p.on{background:var(--yel);color:var(--ink)}
.chip.all{background:var(--ink);color:#fff}
.row{display:flex;gap:8px;margin-top:12px}
input{flex:1;min-width:0;background:var(--w);border:3px solid var(--ink);border-radius:0;color:var(--ink);padding:12px 14px;font-size:16px;font-family:inherit}
.btn{border:3px solid var(--ink);background:var(--w);border-radius:0;padding:12px 16px;font-size:16px;font-weight:800}
.btn.big{display:block;width:100%;margin-top:28px;padding:18px;font-size:20px;font-weight:900;text-transform:uppercase;background:var(--red);color:#fff;box-shadow:6px 6px 0 var(--ink)}
.btn.big:active{transform:translate(4px,4px);box-shadow:2px 2px 0 var(--ink)}
.btn:disabled{opacity:.35;box-shadow:none}
.back{background:none;border:0;font-size:16px;font-weight:800;padding:16px 0 0;text-decoration:underline}
.msg{font-size:14px;font-weight:700;margin-top:12px;min-height:18px;color:var(--red)}
h1.g{font-size:30px;font-weight:900;text-transform:uppercase;margin:14px 0 0;letter-spacing:-.02em}

/* Jeu */
.play{display:none;flex-direction:column;min-height:100svh;padding-bottom:6px}
.play.on{display:flex}
.top{display:flex;justify-content:space-between;align-items:center;font-weight:800;font-size:14px;padding-top:8px}
.card{--cbg:#fffdf7;--cfg:#111;flex:1;display:flex;flex-direction:column;justify-content:center;text-align:left;margin:14px 0;padding:26px 22px;background:var(--cbg);color:var(--cfg);border:4px solid var(--ink);box-shadow:8px 8px 0 var(--ink);position:relative;transition:background .15s}
.card:after{content:"";position:absolute;right:-4px;top:-4px;width:54px;height:54px;background:var(--ink);clip-path:polygon(0 0,100% 0,100% 100%)}
.tag{font-size:13px;text-transform:uppercase;letter-spacing:.1em;font-weight:900;margin-bottom:20px;padding-right:44px}
.txt{font-size:28px;line-height:1.28;font-weight:900;letter-spacing:-.01em}
.txt b{background:var(--ink);color:#fff;padding:0 7px;white-space:nowrap}
.ans{display:none;margin-top:18px;padding:12px 14px;background:var(--ink);color:#fff;font-weight:900;font-size:22px}
.rule{margin-top:18px;font-size:13px;font-weight:700;opacity:.75}
.about{border:3px solid var(--ink);background:var(--w);padding:12px 14px;margin-top:12px;font-size:14px;line-height:1.4}
.about p{margin:0 0 8px}.about p:last-child{margin:0}
.about:empty{display:none}
.rules{padding-left:24px;margin:0}.rules li{margin:0 0 14px;font-size:17px;line-height:1.4;font-weight:600}
.meta{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.meta span{border:3px solid var(--ink);background:var(--yel);padding:6px 10px;font-weight:800;font-size:13px}
.film{font-size:15px;font-weight:800;opacity:.85;display:inline-block;margin-bottom:10px}
.hint{font-size:13px;text-align:center;font-weight:700}
.bar{display:flex;height:10px;margin-top:10px;border:3px solid var(--ink)}
.bar i{flex:1}.bar i:nth-child(1){background:var(--red)}.bar i:nth-child(2){background:var(--yel)}.bar i:nth-child(3){background:var(--blue)}
</style>
</head>
<body>

<section class="screen on" id="s1">
  <div class="mond">
    <div class="r a"></div>
    <div class="t"><h1>La boîte à jeux<br>de <span>Lucie</span></h1></div>
    <div class="y"></div>
    <div class="b"></div>

<section class="screen" id="s2">

  <div class="msg" id="msg"></div>

<section class="screen" id="s4">
  <button class="back" id="back4">← Retour</button>
  <h1 class="g">🃏 Cartes</h1>
  <p class="sub">Choisissez un jeu pour lire ses règles</p>
  <div id="cardgames"></div>
</section>

<section class="screen" id="s5">
  <button class="back" id="back5">← Retour</button>
  <h1 class="g" id="rtitle"></h1>
  <div class="meta" id="rmeta"></div>
  <p class="sub" id="rresume"></p>
  <h2>Règles</h2>
  <ol class="rules" id="rlist"></ol>
</section>

<section class="play" id="s3">

  <div class="card" id="card" role="button">

    <div class="txt" id="qtxt"></div>
    <div class="ans" id="ans"></div>
    <div class="rule" id="rule"></div>
  </div>
  <div class="hint" id="hint">Touchez la carte pour la suivante</div>
  <div class="bar"><i></i><i></i><i></i></div>
</section>

function clean(s){return String(s==null?"":s).trim()}
function uniq(a){return a.filter(function(v,i){return a.indexOf(v)===i})}
function sheet(wb, name){return wb.Sheets[name] ? XLSX.utils.sheet_to_json(wb.Sheets[name], {defval:""}) : []}
function parse(wb){
  var q = sheet(wb,"Questions");
  DATA.questions = q.map(function(r){return {jeu:clean(r.jeu),categorie:clean(r.categorie),type:clean(r.type),texte:clean(r.texte),reponse:clean(r.reponse),film:clean(r.film)}})
    .filter(function(r){return r.jeu && r.texte});
  DATA.players = sheet(wb,"Joueurs").map(function(r){return clean(r.prenom)}).filter(Boolean);
  var j = sheet(wb,"Jeux").map(function(r){return {jeu:clean(r.jeu),famille:clean(r.famille),emoji:clean(r.emoji),regle:clean(r.regle),description:clean(r.description)}}).filter(function(r){return r.jeu});
  uniq(DATA.questions.map(function(r){return r.jeu})).forEach(function(g){
    if(!j.some(function(x){return x.jeu===g})) j.push({jeu:g,famille:"Jeux de cartes",emoji:"🎲",regle:"",description:""});
  });
  DATA.cartes = sheet(wb,"Cartes").map(function(r){return {jeu:clean(r.jeu),emoji:clean(r.emoji),joueurs:clean(r.joueurs),materiel:clean(r.materiel),resume:clean(r.resume),regles:clean(r.regles)}}).filter(function(r){return r.jeu});
  DATA.jeux = j.map(function(x){x.famille = x.famille || "Jeux de cartes"; return x});
  DATA.jeux.forEach(function(g){
    if(wb.Sheets[g.jeu]){
      sheet(wb,g.jeu).forEach(function(r){
        var tx = clean(r.texte);
        if(tx) DATA.questions.push({jeu:g.jeu,categorie:clean(r.categorie),type:clean(r.type),texte:tx,reponse:clean(r.reponse),film:clean(r.film)});
      });
    }
  });
}
async function load(){
  try{
    var r = await fetch("questions.xlsx", {cache:"no-store"});
    if(!r.ok) throw new Error("no file");
    parse(XLSX.read(await r.arrayBuffer(), {type:"array"}));
    if(!DATA.questions.length) throw new Error("empty");
  }catch(e){ DATA = FALLBACK; }
  DATA.cartes = DATA.cartes || [];
  allPlayers = DATA.players.slice();
  renderFamilies();
}

function toggleAll(set, all){
  var full = all.every(function(x){return set.has(x)});
  all.forEach(function(x){ if(full) set.delete(x); else set.add(x); });

  cats.forEach(function(c){
    cb.appendChild(chip((EMOJI[c]||"✨")+" "+c, sel.cats.has(c), "c", function(){
      if(sel.cats.has(c)) sel.cats.delete(c); else sel.cats.add(c); renderSetup();
    }));
  });
  var pb = $("players"); pb.innerHTML = "";
  allPlayers.forEach(function(p){
    pb.appendChild(chip(p, sel.players.has(p), "p", function(){
      if(sel.players.has(p)) sel.players.delete(p); else sel.players.add(p); renderSetup();
    }));
  });
  var okCats = cats.filter(function(c){return sel.cats.has(c)}).length;
  var m = sel.games.size===0 ? "Choisissez au moins un jeu" : (okCats===0 ? "Choisissez au moins une catégorie" : (sel.players.size<2 ? "Sélectionnez au moins 2 joueurs" : ""));
  $("msg").textContent = m; $("start").disabled = !!m;
}
function addName(){
  var v = clean($("newName").value);
  if(!v) return;
  v = v.charAt(0).toUpperCase()+v.slice(1);
  var found = allPlayers.filter(function(p){return p.toLowerCase()===v.toLowerCase()})[0];
  if(!found){ allPlayers.push(v); found = v; }
  sel.players.add(found); $("newName").value = ""; renderSetup();
}
function shuffle(a){for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}
function startGame(){
  var pool = DATA.questions.filter(function(q){
    return sel.games.has(q.jeu) && sel.cats.has(q.categorie) && (!q.type || sel.type==="Les deux" || q.type===sel.type);
  });
  if(!pool.length){ $("msg").textContent = "Aucune carte pour cette sélection"; return; }
  deck = shuffle(pool.slice()); idx = -1; show("s3"); next();
}
function fill(t){
  var ps = shuffle(Array.from(sel.players));
  return t.replace(/\{J(\d)\}/g, function(m, n){ return "<b>"+ps[(parseInt(n,10)-1) % ps.length]+"</b>"; });
}
function next(){
  idx++;
  if(idx >= deck.length){ deck = shuffle(deck); idx = 0; }
  var q = deck[idx], st = CAT_STYLE[q.categorie] || ["#fffdf7","#111"], c = $("card");
  c.style.setProperty("--cbg", st[0]); c.style.setProperty("--cfg", st[1]);
  $("tag").textContent = q.jeu+" · "+q.categorie+(q.type?" · "+q.type:"");
  $("qtxt").innerHTML = (q.film ? '<small class="film">🎬 '+q.film+'</small><br>' : "") + fill(q.texte);
  revealed = false; $("ans").style.display = "none"; $("ans").textContent = q.reponse || "";
  var gm = DATA.jeux.filter(function(g){return g.jeu===q.jeu})[0];
  $("rule").textContent = (gm && gm.regle) || "";
  $("hint").textContent = q.reponse ? "Touchez la carte pour voir la réponse" : "Touchez la carte pour la suivante";
  $("count").textContent = (idx+1)+" / "+deck.length;
}
$("back2").onclick = function(){show("s1")};
$("back4").onclick = function(){show("s1")};
$("back5").onclick = function(){show("s4")};
$("quit").onclick = function(){show("s2")};
$("addBtn").onclick = addName;
$("newName").addEventListener("keydown", function(e){if(e.key==="Enter"){e.preventDefault();addName()}});
$("start").onclick = startGame;
$("card").onclick = function(){
  var q = deck[idx];
  if(q && q.reponse && !revealed){ revealed = true; $("ans").style.display = "block"; $("hint").textContent = "Touchez la carte pour la suivante"; }
  else next();
};
load();
</script>
</body>
</html>
